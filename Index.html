<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Style'); ?>
</head>
<body>
  <h1>🚜 ระบบขอย้ายเครื่องจักร</h1>
  <div id="app"><div class="loading">กำลังตรวจสอบสิทธิ์ผู้ใช้งาน...</div></div>

  <script>var LIFF_ID = '2010592933-J3nNOO6d';</script>
  <?!= include('LiffCommon'); ?>
  <script>
    var PAGE_BY_ROLE = {
      'ช่างคุมงาน': [{ page: 'request', label: '📋 ขอย้ายเครื่องจักร / ดูคำขอของฉัน' }],
      'ผู้อนุมัติ': [{ page: 'approve', label: '✅ อนุมัติคำขอย้าย' }],
      'เสมียน1': [{ page: 'clerk1', label: '🗂 ภาพรวม/ตรวจสอบคำขอทั้งหมด' }],
      'เสมียน2': [{ page: 'clerk2', label: '🔢 ออกเลข PJ' }],
      'เสมียน3': [{ page: 'clerk3', label: '🧾 ตรวจสอบ/ปิดงาน + ค่าเที่ยว' }],
      'คนขับ': [{ page: 'driver', label: '🚚 คิวงานย้ายเครื่องจักร' }]
    };

    initLiff(function (profile) {
      callServer('whoAmI', profile.userId).then(renderMenu).catch(function (err) {
        document.getElementById('app').innerHTML = '<div class="empty">เกิดข้อผิดพลาด: ' + err + '</div>';
      });
    });

    function renderMenu(info) {
      var el = document.getElementById('app');
      if (!info.registered) {
        el.innerHTML = '<div class="card">บัญชี LINE นี้ยังไม่ได้ลงทะเบียนสิทธิ์ผู้ใช้งาน<br>กรุณาแจ้งเสมียน 1 เพื่อเพิ่มชื่อในระบบ</div>';
        return;
      }
      var links = PAGE_BY_ROLE[info.role] || [];
      var html = '<div class="card">สวัสดี ' + info.name + '<br><span class="badge">' + info.role + '</span></div>';
      links.forEach(function (l) {
        html += '<a class="btn" style="display:block;text-align:center;text-decoration:none;" href="?page=' + l.page + '">' + l.label + '</a>';
      });
      el.innerHTML = html;
    }
  </script>
</body>
</html>
